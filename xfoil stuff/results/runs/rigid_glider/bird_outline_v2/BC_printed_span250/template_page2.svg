<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect width="100%" height="100%" fill="white"/>
<text x="12.00" y="14.00" font-family="Segoe UI,Arial" font-size="3.8" text-anchor="start" fill="#18222d" font-weight="bold">BC crow-like 250 mm: build notes</text>
<text x="12.00" y="20.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">Tail bend: rotate the fan tail about the hinge, trailing edge UP.</text>
<text x="12.00" y="24.20" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">Score the top face, bend up to the gauge, glue the crease.</text>
<text x="12.00" y="28.40" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">One sheet, one bend. These are build instructions,</text>
<text x="12.00" y="32.60" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">not a prediction that the glider pulls out.</text>
<polygon points="20.00,90.00 140.00,90.00 140.00,85.81" fill="#fbeedd" fill-opacity="0.6" stroke="#000" stroke-width="0.4"/>
<text x="22.00" y="95.50" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">gauge for a 2 deg bend: lay the wing along the long edge; the tail follows the slanted edge</text>
<text x="76.00" y="88.00" font-family="Segoe UI,Arial" font-size="3.0" text-anchor="start" fill="#c2621a" font-weight="bold">2 deg</text>
<text x="12.00" y="250.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">Wrist line: a marker only; the sheet is not cut or creased there.</text>
<text x="12.00" y="255.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">CG: knife edge. The 0 mark of the printed rail goes at the wing root LE.</text>
