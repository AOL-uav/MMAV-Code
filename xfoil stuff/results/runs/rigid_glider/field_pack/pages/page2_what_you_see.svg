<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect x="0" y="0" width="215.9" height="279.4" fill="#ffffff"/>
<text x="10.00" y="17.00" font-family="Helvetica" font-size="5.6" fill="#000000" font-weight="bold">What you see -&gt; what it means -&gt; what to change next</text>
<text x="10.00" y="22.50" font-family="Helvetica" font-size="3.8" fill="#000000">MODEL = from our computer model, not a fact (results/runs/rigid_glider/pullout/). FIRM = follows</text>
<text x="10.00" y="27.36" font-family="Helvetica" font-size="3.8" fill="#000000">from symmetry or from the project's own tests. Bending the trailing edge up and the drop height</text>
<text x="10.00" y="32.23" font-family="Helvetica" font-size="3.8" fill="#000000">are Kai's decisions.</text>
<rect x="10.000" y="39.092" width="195.900" height="6.400" fill="#e6e6e6" stroke="#000000" stroke-width="0.3"/>
<text x="11.20" y="43.49" font-family="Helvetica" font-size="3.8" fill="#000000" font-weight="bold">What you see</text>
<text x="57.20" y="43.49" font-family="Helvetica" font-size="3.8" fill="#000000" font-weight="bold">What it probably means</text>
<text x="133.20" y="43.49" font-family="Helvetica" font-size="3.8" fill="#000000" font-weight="bold">What to change next</text>
<rect x="10.000" y="45.492" width="195.900" height="32.050" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="49.49" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Darts straight down</text>
<text x="11.20" y="54.37" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">(log: dive)</text>
<text x="57.20" y="49.49" font-family="Helvetica" font-size="3.9" fill="#000000">FIRM: released exactly nose-down</text>
<text x="57.20" y="54.37" font-family="Helvetica" font-size="3.9" fill="#000000">with the CG ahead of the lift</text>
<text x="57.20" y="59.24" font-family="Helvetica" font-size="3.9" fill="#000000">point, a flat symmetric wing has</text>
<text x="57.20" y="64.12" font-family="Helvetica" font-size="3.9" fill="#000000">no moment to start pitching, so it</text>
<text x="57.20" y="68.99" font-family="Helvetica" font-size="3.9" fill="#000000">stays a dart. Says nothing against</text>
<text x="57.20" y="73.87" font-family="Helvetica" font-size="3.9" fill="#000000">the wing.</text>
<text x="133.20" y="49.49" font-family="Helvetica" font-size="3.9" fill="#000000">Do the level hand glide first.</text>
<text x="133.20" y="54.37" font-family="Helvetica" font-size="3.9" fill="#000000">Then move the CG aft 1 mm at a</text>
<text x="133.20" y="59.24" font-family="Helvetica" font-size="3.9" fill="#000000">time (kit table). Bending the</text>
<text x="133.20" y="64.12" font-family="Helvetica" font-size="3.9" fill="#000000">trailing edge up is Kai's</text>
<text x="133.20" y="68.99" font-family="Helvetica" font-size="3.9" fill="#000000">decision.</text>
<line x1="56.0000" y1="45.4920" x2="56.0000" y2="77.5420" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="45.4920" x2="132.0000" y2="77.5420" stroke="#000000" stroke-width="0.25"/>
<rect x="10.000" y="77.542" width="195.900" height="27.175" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="81.54" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Swoops, then glides</text>
<text x="11.20" y="86.42" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">(log: steady glide)</text>
<text x="57.20" y="81.54" font-family="Helvetica" font-size="3.9" fill="#000000">MODEL: a first swoop of about 6 m</text>
<text x="57.20" y="86.42" font-family="Helvetica" font-size="3.9" fill="#000000">or more is expected even for a</text>
<text x="57.20" y="91.29" font-family="Helvetica" font-size="3.9" fill="#000000">wing that will glide, so a short</text>
<text x="57.20" y="96.17" font-family="Helvetica" font-size="3.9" fill="#000000">drop cannot tell 'never pulls out'</text>
<text x="57.20" y="101.04" font-family="Helvetica" font-size="3.9" fill="#000000">from 'needs more height'.</text>
<text x="133.20" y="81.54" font-family="Helvetica" font-size="3.9" fill="#000000">Log distance and time; repeat 5</text>
<text x="133.20" y="86.42" font-family="Helvetica" font-size="3.9" fill="#000000">times (10 if it glides). Drop</text>
<text x="133.20" y="91.29" font-family="Helvetica" font-size="3.9" fill="#000000">height is Kai's decision.</text>
<line x1="56.0000" y1="77.5420" x2="56.0000" y2="104.7170" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="77.5420" x2="132.0000" y2="104.7170" stroke="#000000" stroke-width="0.25"/>
<rect x="10.000" y="104.717" width="195.900" height="22.300" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="108.72" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Mushes: flat, slow,</text>
<text x="11.20" y="113.59" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">steep descent (log:</text>
<text x="11.20" y="118.47" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">steady glide, note</text>
<text x="11.20" y="123.34" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">'mush')</text>
<text x="57.20" y="108.72" font-family="Helvetica" font-size="3.9" fill="#000000">Flying near stall. The model</text>
<text x="57.20" y="113.59" font-family="Helvetica" font-size="3.9" fill="#000000">cannot say at which CG an untabbed</text>
<text x="57.20" y="118.47" font-family="Helvetica" font-size="3.9" fill="#000000">flat wing settles. Cause not</text>
<text x="57.20" y="123.34" font-family="Helvetica" font-size="3.9" fill="#000000">established.</text>
<text x="133.20" y="108.72" font-family="Helvetica" font-size="3.9" fill="#000000">Check flatness and twist. Try the</text>
<text x="133.20" y="113.59" font-family="Helvetica" font-size="3.9" fill="#000000">neighbouring settings, 1 mm</text>
<text x="133.20" y="118.47" font-family="Helvetica" font-size="3.9" fill="#000000">forward and aft, and compare.</text>
<line x1="56.0000" y1="104.7170" x2="56.0000" y2="127.0170" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="104.7170" x2="132.0000" y2="127.0170" stroke="#000000" stroke-width="0.25"/>
<rect x="10.000" y="127.017" width="195.900" height="27.175" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="131.02" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Nose up, stalls,</text>
<text x="11.20" y="135.89" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">repeats (pitch-up or</text>
<text x="11.20" y="140.77" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">stall; pitch</text>
<text x="11.20" y="145.64" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">oscillation)</text>
<text x="57.20" y="131.02" font-family="Helvetica" font-size="3.9" fill="#000000">Seen behind the neutral point. On</text>
<text x="57.20" y="135.89" font-family="Helvetica" font-size="3.9" fill="#000000">a swept, tapered wing the tips may</text>
<text x="57.20" y="140.77" font-family="Helvetica" font-size="3.9" fill="#000000">let go first (unknown). Pitch</text>
<text x="57.20" y="145.64" font-family="Helvetica" font-size="3.9" fill="#000000">oscillation is about the balance</text>
<text x="57.20" y="150.52" font-family="Helvetica" font-size="3.9" fill="#000000">point and the wing, not the fins.</text>
<text x="133.20" y="131.02" font-family="Helvetica" font-size="3.9" fill="#000000">Check twist. Move the CG forward 1</text>
<text x="133.20" y="135.89" font-family="Helvetica" font-size="3.9" fill="#000000">mm. Do not blame the fins.</text>
<line x1="56.0000" y1="127.0170" x2="56.0000" y2="154.1920" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="127.0170" x2="132.0000" y2="154.1920" stroke="#000000" stroke-width="0.25"/>
<rect x="10.000" y="154.192" width="195.900" height="22.300" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="158.19" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Tumbles (tumble)</text>
<text x="57.20" y="158.19" font-family="Helvetica" font-size="3.9" fill="#000000">In the published plate study,</text>
<text x="57.20" y="163.07" font-family="Helvetica" font-size="3.9" fill="#000000">tumbling came with the centre of</text>
<text x="57.20" y="167.94" font-family="Helvetica" font-size="3.9" fill="#000000">mass furthest aft (unswept plates;</text>
<text x="57.20" y="172.82" font-family="Helvetica" font-size="3.9" fill="#000000">not our wings).</text>
<text x="133.20" y="158.19" font-family="Helvetica" font-size="3.9" fill="#000000">Move the CG forward. The stop rule</text>
<text x="133.20" y="163.07" font-family="Helvetica" font-size="3.9" fill="#000000">decides when the sweep ends.</text>
<line x1="56.0000" y1="154.1920" x2="56.0000" y2="176.4920" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="154.1920" x2="132.0000" y2="176.4920" stroke="#000000" stroke-width="0.25"/>
<rect x="10.000" y="176.492" width="195.900" height="22.300" fill="none" stroke="#000000" stroke-width="0.25"/>
<text x="11.20" y="180.49" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">Turns or spirals</text>
<text x="11.20" y="185.37" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">(roll-off left /</text>
<text x="11.20" y="190.24" font-family="Helvetica" font-size="3.9" fill="#000000" font-weight="bold">right; yaw wander)</text>
<text x="57.20" y="180.49" font-family="Helvetica" font-size="3.9" fill="#000000">Yaw wander (nose swings side to</text>
<text x="57.20" y="185.37" font-family="Helvetica" font-size="3.9" fill="#000000">side) points at the fins. Roll-off</text>
<text x="57.20" y="190.24" font-family="Helvetica" font-size="3.9" fill="#000000">points at a twisted or uneven</text>
<text x="57.20" y="195.12" font-family="Helvetica" font-size="3.9" fill="#000000">wing.</text>
<text x="133.20" y="180.49" font-family="Helvetica" font-size="3.9" fill="#000000">Check the fins are square, the</text>
<text x="133.20" y="185.37" font-family="Helvetica" font-size="3.9" fill="#000000">wing flat and not twisted. Re-fly.</text>
<line x1="56.0000" y1="176.4920" x2="56.0000" y2="198.7920" stroke="#000000" stroke-width="0.25"/>
<line x1="132.0000" y1="176.4920" x2="132.0000" y2="198.7920" stroke="#000000" stroke-width="0.25"/>
<text x="10.00" y="273.50" font-family="Helvetica" font-size="3.0" fill="#444444">Sources: FLAT_TEST.md; pull-out study (MODEL). Field pack, page 2 of 4.</text>
</svg>