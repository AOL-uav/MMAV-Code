<text x="10.00" y="22.00" font-family="Helvetica" font-size="3.8" fill="#000000">Print at 100 % and check the 100 mm bar below. Cut out each wedge along its three sides. Lay one</text>
<text x="10.00" y="26.86" font-family="Helvetica" font-size="3.8" fill="#000000">long edge along the wing and the other along the bent trailing-edge tab or the bird tail: the gap</text>
<text x="10.00" y="31.73" font-family="Helvetica" font-size="3.8" fill="#000000">should close at the tip. The angle is the angle between the two long edges (computed, not drawn</text>
<text x="10.00" y="36.59" font-family="Helvetica" font-size="3.8" fill="#000000">by eye).</text>
