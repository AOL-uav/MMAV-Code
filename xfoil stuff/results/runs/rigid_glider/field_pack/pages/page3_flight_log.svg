<text x="10.00" y="36.50" font-family="Helvetica" font-size="3.4" fill="#000000">Which wing was the 'about 15 g' is still unconfirmed: write the weighed masses here.</text>
<text x="10.00" y="42.50" font-family="Helvetica" font-size="3.5" fill="#000000">Launch: H = level hand throw, N = nose-down drop. CG = mm aft of the root leading edge (or rail tick).</text>
<text x="10.00" y="46.98" font-family="Helvetica" font-size="3.5" fill="#000000">Tab / bend in degrees, trailing edge up.</text>
<text x="10.00" y="52.26" font-family="Helvetica" font-size="3.5" fill="#000000">Result (write the letter): S = steady glide, D = dive, P = pitch-up or stall, O = pitch oscillation, T =</text>
<text x="10.00" y="56.74" font-family="Helvetica" font-size="3.5" fill="#000000">tumble, L = roll-off left, R = roll-off right, Y = yaw wander. A mush is logged as S with a note in</text>
<text x="10.00" y="61.22" font-family="Helvetica" font-size="3.5" fill="#000000">Notes.</text>
