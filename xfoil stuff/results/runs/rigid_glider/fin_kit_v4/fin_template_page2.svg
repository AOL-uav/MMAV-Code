<text x="10.00" y="15.00" font-family="Helvetica" font-size="5.6" fill="#000000" font-weight="bold">Fin kit v4 templates: printed 250 mm build</text>
<text x="10.00" y="21.00" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">printed 250 mm build. 1:1 cut templates, white paper, print at 100 %.</text>
<text x="10.00" y="25.20" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">S1 reaches Cn_beta 0.004 in AVL, S2 reaches 0.006, S3 = 2% of the wing area (sizes and numbers: index.html, MODEL).</text>
<text x="10.00" y="29.40" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">Tip fins: vertical on the wing top at 95% of the wing, trailing edge level with the wing&#x27;s. Tail fin: on the tail centreline,</text>
<text x="10.00" y="33.60" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">1 mm in from the tail end. Dashed orange line = attachment line (fin base on the sheet); the hatched strip below it is the</text>
<text x="10.00" y="37.80" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">glue / tape tab, which lies flat on the sheet.</text>
