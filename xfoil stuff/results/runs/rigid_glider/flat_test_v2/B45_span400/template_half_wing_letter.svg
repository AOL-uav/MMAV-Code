<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect width="100%" height="100%" fill="white"/>
<text x="12.00" y="14.00" font-family="Segoe UI,Arial" font-size="5" text-anchor="start" fill="#18222d" font-weight="bold">B45: ONE HALF of the wing, 1:1, US Letter portrait</text>
<text x="12.00" y="19.50" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Foamboard 5 mm (ASSUMED: measure yours). Span 400, root chord 118.5, tip chord 59.3, sweep 25 deg, zero dihedral.</text>
<text x="12.00" y="23.70" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Cut along the solid outline. Trace it on the board, then flip the template over on the dashed</text>
<text x="12.00" y="27.90" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">centreline and trace the other half. The wing is one piece. Print at 100 % (actual size).</text>
<rect x="79.00" y="40.00" width="21.00" height="208.00" fill="#28834f" fill-opacity="0.18"/>
<text x="79.00" y="38.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#28834f" font-weight="normal">CG test range 57-78 mm aft of root LE (JUDGEMENT)</text>
<polygon points="22.000,244.000 130.076,44.000 189.336,44.000 140.519,244.000" fill="#e6eef6" fill-opacity="0.5" stroke="#000" stroke-width="0.5"/>
<line  x1="16.000" y1="244.000" x2="154.519" y2="244.000" stroke="#555" stroke-width="0.35" stroke-dasharray="3 2"/>
<text x="16.00" y="248.50" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#555" font-weight="normal">centreline: flip here for the other half</text>
<line  x1="92.238" y1="40.000" x2="92.238" y2="248.000" stroke="#b0261d" stroke-width="0.4" stroke-dasharray="2 1.5"/>
<text x="93.74" y="56.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#b0261d" font-weight="normal">AVL neutral point 70.2 (AVL, outline only)</text>
<line  x1="22.000" y1="252.000" x2="22.000" y2="236.000" stroke="#000" stroke-width="0.35"/>
<text x="24.00" y="254.50" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">root leading edge (x = 0)</text>
<text x="187.34" y="42.50" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="end" fill="#c2621a" font-weight="normal">tip edge: fin butt-glues here, centred on the board mid-plane</text>
<line id="scalebar" x1="22.000" y1="258.000" x2="122.000" y2="258.000" stroke="#000" stroke-width="0.5"/>
<line  x1="22.000" y1="256.000" x2="22.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
