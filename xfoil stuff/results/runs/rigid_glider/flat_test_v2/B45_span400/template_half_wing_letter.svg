<line  x1="122.000" y1="256.000" x2="122.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<text x="22.00" y="264.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Scale bar: this line must measure exactly 100 mm on your print.</text>
<text x="22.00" y="268.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">If it does not, print at 100 % (actual size), not fit-to-page.</text>
