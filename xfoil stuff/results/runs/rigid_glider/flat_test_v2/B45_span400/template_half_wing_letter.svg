<line  x1="52.000" y1="256.000" x2="52.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="62.000" y1="256.000" x2="62.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="72.000" y1="256.000" x2="72.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="82.000" y1="256.000" x2="82.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
