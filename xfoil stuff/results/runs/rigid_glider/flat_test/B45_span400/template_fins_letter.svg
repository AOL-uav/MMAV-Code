<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect width="100%" height="100%" fill="white"/>
<text x="12.00" y="14.00" font-family="Segoe UI,Arial" font-size="5" text-anchor="start" fill="#18222d" font-weight="bold">B45: TWO tip fins, 1:1, US Letter portrait</text>
<text x="12.00" y="19.50" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Each fin 59.3 x 24.0 mm (chord = tip chord, height 24 mm x span/400): about 4 % of wing area.</text>
<text x="12.00" y="23.70" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Cut two from the same foamboard. Butt-glue each to the wing tip edge, centred on the board</text>
<text x="12.00" y="27.90" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">mid-plane (no tabs). Check they stand square. Print at 100 % (actual size).</text>
<rect x="22" y="40.00" width="59.259" height="24.000" fill="#fbeedd" stroke="#000" stroke-width="0.5"/>
<rect x="22" y="49.500" width="59.259" height="5.000" fill="none" stroke="#c2621a" stroke-width="0.25" stroke-dasharray="2 1.5"/>
<text x="85.26" y="52.00" font-family="Segoe UI,Arial" font-size="3.0" text-anchor="start" fill="#18222d" font-weight="normal">fin 1: 59.3 x 24.0 mm</text>
<rect x="22" y="79.00" width="59.259" height="24.000" fill="#fbeedd" stroke="#000" stroke-width="0.5"/>
<rect x="22" y="88.500" width="59.259" height="5.000" fill="none" stroke="#c2621a" stroke-width="0.25" stroke-dasharray="2 1.5"/>
<text x="85.26" y="91.00" font-family="Segoe UI,Arial" font-size="3.0" text-anchor="start" fill="#18222d" font-weight="normal">fin 2: 59.3 x 24.0 mm</text>
<text x="22.00" y="120.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#c2621a" font-weight="normal">Dashed band = where the wing tip edge lands on the fin (board thickness, ASSUMED 5 mm,</text>
<text x="22.00" y="124.20" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#c2621a" font-weight="normal">centred on the fin height). Re-mark it with your measured thickness.</text>
<line id="scalebar" x1="22.000" y1="258.000" x2="122.000" y2="258.000" stroke="#000" stroke-width="0.5"/>
<line  x1="22.000" y1="256.000" x2="22.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="32.000" y1="256.000" x2="32.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="42.000" y1="256.000" x2="42.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="52.000" y1="256.000" x2="52.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="62.000" y1="256.000" x2="62.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="72.000" y1="256.000" x2="72.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="82.000" y1="256.000" x2="82.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="92.000" y1="256.000" x2="92.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="102.000" y1="256.000" x2="102.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="112.000" y1="256.000" x2="112.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="122.000" y1="256.000" x2="122.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<text x="22.00" y="264.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Scale bar: this line must measure exactly 100 mm on your print.</text>
<text x="22.00" y="268.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">If it does not, print at 100 % (actual size), not fit-to-page.</text>
