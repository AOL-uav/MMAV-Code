<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
<rect width="100%" height="100%" fill="white"/>
<text x="12.00" y="14.00" font-family="Segoe UI,Arial" font-size="4.4" text-anchor="start" fill="#18222d" font-weight="bold">BS swift-like: build notes and tail-bend angle gauge, 1:1</text>
<text x="12.00" y="20.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">Tail bend is a rotation of the fan tail about the hinge line, trailing edge UP. Score the top face with a V cut (leave the bottom paper),</text>
<text x="12.00" y="24.20" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">bend the tail up to the gauge line, glue the crease. One sheet, one bend. A flat symmetric sheet has no nose-up moment at zero lift;</text>
<text x="12.00" y="28.40" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">this bend is what supplies it. These are build instructions, not a prediction that the glider pulls out.</text>
<polygon points="20.00,70.00 140.00,70.00 140.00,59.50" fill="#fbeedd" fill-opacity="0.6" stroke="#000" stroke-width="0.4"/>
<text x="22.00" y="75.50" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">gauge for a 5 deg bend: lay the wing along the long edge; the tail&#x27;s top face follows the slanted edge</text>
<text x="76.00" y="68.00" font-family="Segoe UI,Arial" font-size="3.0" text-anchor="start" fill="#c2621a" font-weight="bold">5 deg</text>
<polygon points="20.00,140.00 140.00,140.00 140.00,118.84" fill="#fbeedd" fill-opacity="0.6" stroke="#000" stroke-width="0.4"/>
<text x="22.00" y="145.50" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">gauge for a 10 deg bend: lay the wing along the long edge; the tail&#x27;s top face follows the slanted edge</text>
<text x="76.00" y="138.00" font-family="Segoe UI,Arial" font-size="3.0" text-anchor="start" fill="#c2621a" font-weight="bold">10 deg</text>
<text x="12.00" y="225.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">Wrist joint line: a drawn marker for later folding; the sheet is not cut or creased there.</text>
<text x="12.00" y="230.00" font-family="Segoe UI,Arial" font-size="2.6" text-anchor="start" fill="#18222d" font-weight="normal">CG: measure with a knife edge; the 0 mark of the printed CG rail goes at the wing root leading edge at the centreline.</text>
<line id="scalebar" x1="12.000" y1="258.000" x2="112.000" y2="258.000" stroke="#000" stroke-width="0.5"/>
<line  x1="12.000" y1="256.000" x2="12.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="22.000" y1="256.000" x2="22.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="32.000" y1="256.000" x2="32.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="42.000" y1="256.000" x2="42.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="52.000" y1="256.000" x2="52.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="62.000" y1="256.000" x2="62.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="72.000" y1="256.000" x2="72.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="82.000" y1="256.000" x2="82.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="92.000" y1="256.000" x2="92.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="102.000" y1="256.000" x2="102.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<line  x1="112.000" y1="256.000" x2="112.000" y2="260.000" stroke="#000" stroke-width="0.35"/>
<text x="12.00" y="264.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">Scale bar: this line must measure exactly 100 mm on your print.</text>
<text x="12.00" y="268.00" font-family="Segoe UI,Arial" font-size="2.8" text-anchor="start" fill="#18222d" font-weight="normal">If it does not, print at 100 % (actual size), not fit-to-page.</text>
</svg>