<text x="10.00" y="15.00" font-family="Helvetica" font-size="5.4" fill="#000000" font-weight="bold">Zanonia glider, 250 mm span, ONE HALF, 1:1 (flip on the centre line)</text>
<text x="10.00" y="21.00" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">Cardstock or foam-plate template, secondary to the printed plates. Print at 100 % (not fit to page); check the bar below.</text>
<text x="10.00" y="25.20" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">Cut the solid line. Curl: roll each tip, flight-upper face DOWN, over a 3/16 in (4.8 mm) dowel (the page: &#x27;just a slight curve&#x27;).</text>
<text x="10.00" y="29.40" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">Purple dotted lines: 20, 30 and 40% of the semi-span. Circle: ballast hole for clay or blu-tack.</text>
<text x="10.00" y="33.60" font-family="Helvetica" font-size="3.0" fill="#000000" font-weight="normal">Green cross: the CG marked on the published pattern (MEASURED-FROM-SCAN). Ticks along the centre line: mm from the leading edge.</text>
